<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Analytics Tool</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --panel: #ffffff;
            --text: #1d2330;
            --muted: #6b7385;
            --border: #dde1e8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14171c;
                --panel: #1d2128;
                --text: #e6e9ef;
                --muted: #9aa3b2;
                --border: #2c323c;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }

        #status {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        #cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .chart-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }

        .chart-panel h2 {
            margin: 0 0 12px;
            font-weight: 600;
            color: var(--text);
            font-size: 16px;
        }

        #chart {
            display: block;
            width: 100%;
            height: 300px;
        }
        .card-name {
            font-size: 12px;
            color: var(--muted);
            overflow-wrap: anywhere; 
        }

        .card-value {
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            margin: 6px 0 4px;
        }

        .card-detail {
            font-size: 12px;
            color: var(--muted);
        }

    </style>
</head>
<body>
<header>
    <h1>Real-Time Analytics Tool</h1>
    <span id="status">CONNECTING…</span>
</header>

<main>
    <section id="cards"></section>

    <section class="chart-panel">
        <h2 id="chart-title">All wikis: edits per second</h2>
        <canvas id="chart" width="800" height="300"></canvas>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
